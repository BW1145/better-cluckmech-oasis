name: Coop repair limits
on:
  pull_request:
    paths:
      - 'cluckmech-coop-mod/src/KamuiPrefabs.cs'
      - 'cluckmech-coop-mod/src/OtherworldHitDisplay.cs'
      - 'cluckmech-coop-mod/src/OtherworldTalentIds.cs'
      - 'cluckmech-coop-mod/src/NetworkObjects.cs'
      - 'cluckmech-coop-mod/tests/CoopRepairs/Stubs.cs'
      - 'cluckmech-coop-mod/tests/CoopRepairLimits/**'
      - '.github/workflows/coop-repair-limits.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            cluckmech-coop-mod/src/KamuiPrefabs.cs
            cluckmech-coop-mod/src/OtherworldHitDisplay.cs
            cluckmech-coop-mod/src/OtherworldTalentIds.cs
            cluckmech-coop-mod/src/NetworkObjects.cs
            cluckmech-coop-mod/tests/CoopRepairs/Stubs.cs
            cluckmech-coop-mod/tests/CoopRepairLimits/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reproduce original unbounded work
        shell: bash
        run: |
          set -euo pipefail
          files=(cluckmech-coop-mod/src/KamuiPrefabs.cs cluckmech-coop-mod/src/OtherworldHitDisplay.cs)
          trap 'git restore -- "${files[@]}"' EXIT
          for file in "${files[@]}"; do
            git show 0a3ed1a988adc7873acdc9886c1519294abdf38f:"$file" > "$file"
          done
          dotnet run --project cluckmech-coop-mod/tests/CoopRepairLimits/CoopRepairLimitsTests.csproj -c Release -- --baseline
      - name: Verify indexed lookup and bounded visual waiting
        run: dotnet run --project cluckmech-coop-mod/tests/CoopRepairLimits/CoopRepairLimitsTests.csproj -c Release
